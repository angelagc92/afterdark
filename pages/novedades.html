<!doctype html>
<html lang="es">

    <head>
        <!-- Metadatos -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Explorar | Afterdark</title>

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="../assets/img/favicon.png">

        <!-- Tipografías -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Literata:wght@200;300;400;500;600&display=swap"
            rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet">

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Configuración del Tailwind -->
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            noche: '#0F061E',
                            violeta: '#7151A9',
                            lila: '#DAC7FF',
                            luna: '#F4EFFA'
                        },
                        fontFamily: {
                            serif: ['Literata', 'Georgia', 'serif'],
                            sans: ['DM Sans', 'sans-serif']
                        },
                    },
                },
            }
        </script>

        <!-- Estilos propios -->
        <link rel="stylesheet" href="../css/style.css">

        <!-- Javascript -->
        <script src="../js/main.js" defer></script>
    </head>

    <body class="min-h-screen flex flex-col bg-noche font-serif text-luna">

        <!-- SALTAR AL MAIN -->
        <a href="#main" class="skip-link">
            Saltar al contenido principal
        </a>

        <!-- CABECERA -->
        <header class="flex flex-wrap items-center gap-x-3 gap-y-2 bg-noche/80 px-4 py-3 sm:gap-x-6 sm:px-6">

            <!-- LOGO -->
            <a href="../index.html" class="shrink-0">
                <img src="../assets/img/logo.png" alt="Afterdark" class="h-10 w-auto sm:h-12">
            </a>

            <!-- NAVEGACIÓN -->
            <nav aria-label="Navegación principal"
                class="order-last flex w-full justify-between px-6 pt-3 text-base text-luna/90 sm:order-none sm:ml-4 sm:w-auto sm:justify-start sm:gap-5 sm:px-0 sm:pt-0">

                <a href="../index.html" class="transition-colors hover:text-lila">
                    Inicio
                </a>

                <a href="./explorar.html" class="transition-colors hover:text-lila">
                    Explorar
                </a>

                <span class="text-lila" aria-current="page">
                    Novedades
                </span>

            </nav>

            <!-- BUSCADOR -->
            <form id="search-form"
                class="ml-auto flex w-32 items-center gap-2 rounded-full border border-lila/20 bg-violeta/35 px-3 py-1.5 shadow-inner shadow-lila/5 backdrop-blur-md transition-all duration-300 hover:border-lila/40 hover:bg-violeta/50 focus-within:border-lila/50 focus-within:bg-violeta/55 sm:w-48">

                <img src="../assets/icons/search.svg" alt=""
                    class="h-4 w-4 shrink-0 opacity-80 transition-opacity duration-300 group-focus-within:opacity-100">

                <input type="search" id="search" name="search" placeholder="Buscar libros, autores..."
                    aria-label="Buscar libros"
                    class="w-full min-w-0 bg-transparent font-sans text-xs text-luna outline-none placeholder:text-luna/60">

            </form>

            <!-- FAVORITOS Y PERFIL -->
            <div class="flex items-center gap-1">

                <a href="#favoritos" aria-label="Favoritos"
                    class="group flex items-center justify-center rounded-full p-2 transition-all duration-300 hover:bg-violeta/25 hover:shadow-[0_0_12px_rgba(218,199,255,0.12)]">

                    <img src="../assets/icons/book-heart.svg" alt=""
                        class="h-7 w-7 opacity-90 transition-all duration-300 group-hover:scale-110 group-hover:opacity-100">
                </a>

                <a href="../pages/login.html" aria-label="Perfil"
                    class="group flex items-center justify-center rounded-full p-2 transition-all duration-300 hover:bg-violeta/25 hover:shadow-[0_0_12px_rgba(218,199,255,0.12)]">

                    <img src="../assets/icons/circle-user-round.svg" alt=""
                        class="h-7 w-7 opacity-90 transition-all duration-300 group-hover:scale-110 group-hover:opacity-100">
                </a>

            </div>

        </header>


        <!-- CONTENIDO PRINCIPAL -->
        <main id="main" class="flex-1">


            <!-- HERO -->
            <section
                class="relative flex h-40 items-center justify-center overflow-hidden bg-cover bg-center px-4 sm:h-48 md:h-56"
                style="background-image: url('../assets/img/hero.png');">

                <!-- Degradado -->
                <div class="absolute inset-0 bg-gradient-to-b from-noche/20 via-noche/30 to-noche/80"></div>

                <!-- Contenido -->
                <div class="relative z-10 flex w-full flex-col items-start gap-3 px-8 text-left sm:px-14 md:px-20">
                    <h1 class="text-glow text-2xl text-lila sm:text-3xl md:text-4xl">
                        Novedades literarias
                    </h1>

                    <p class="font-sans text-sm text-lila sm:text-base">
                        Descubre las últimas publicaciones.
                    </p>
                </div>

            </section>




        </main>


        <footer class="px-4 py-6 sm:px-6">

            <div class="relative mx-auto max-w-7xl overflow-hidden rounded-2xl px-6 py-8 sm:px-10">

                <!-- LÍNEA SUPERIOR -->
                <div class="absolute left-8 right-8 top-5 border-t border-violeta/30"></div>

                <!-- CONTENIDO -->
                <div class="relative z-10 grid grid-cols-2 gap-8 pt-4 md:grid-cols-3 md:items-center">

                    <!-- LOGO -->
                    <div class="col-span-2 flex justify-center md:col-span-1 md:justify-start">

                        <a href="../index.html" class="flex items-center">
                            <img src="../assets/img/logo_book.png" alt="" class="h-12 w-12 object-contain">

                            <img src="../assets/img/logo2.png" alt="Afterdark" class="h-7 w-auto object-contain">
                        </a>

                    </div>


                    <!-- NAVEGACIÓN -->
                    <nav aria-label="Navegación del pie de página"
                        class="col-span-2 grid grid-cols-2 gap-8 md:col-span-2">

                        <!-- AFTERDARK -->
                        <div class="flex flex-col items-center gap-2 md:items-start">

                            <p class="mb-1 text-base text-luna">
                                Afterdark
                            </p>

                            <a href="index.html"
                                class="font-sans text-sm text-luna/75 transition-colors hover:text-lila">
                                Inicio
                            </a>

                            <a href="./pages/explorar.html"
                                class="font-sans text-sm text-luna/75 transition-colors hover:text-lila">
                                Explorar
                            </a>

                            <a href="./pages/novedades.html"
                                class="font-sans text-sm text-luna/75 transition-colors hover:text-lila">
                                Novedades
                            </a>

                        </div>

                        <!-- INFORMACIÓN -->
                        <div class="flex flex-col items-center gap-2 md:items-start">

                            <p class="mb-1 text-base text-luna">
                                Información
                            </p>

                            <a href="#sobre-afterdark"
                                class="font-sans text-sm text-luna/75 transition-colors hover:text-lila">
                                Sobre el proyecto
                            </a>

                            <a href="#contacto"
                                class="font-sans text-sm text-luna/75 transition-colors hover:text-lila">
                                Contacto
                            </a>

                        </div>

                    </nav>

                </div>

            </div>


            <!-- COPYRIGHT -->
            <p class="mt-5 text-center font-sans text-xs text-luna/75">
                © 2026 Afterdark
            </p>

        </footer>


    </body>

</html>
