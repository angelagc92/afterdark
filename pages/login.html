<!doctype html>
<html lang="es"">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Iniciar sesión | Afterdark</title>

        <script src="https://cdn.tailwindcss.com"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;500;600&display=swap" rel="stylesheet">

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            noche: '#0F061E',
                            violeta: '#7151A9',
                            lila: '#DAC7FF',
                            luna: '#F4EFFA'
                        },
                        fontFamily: {
                            serif: ['Literata', 'Georgia', 'serif']
                        }
                    }
                }
            }
        </script>

        <script src="../js/main.js" defer></script>
    </head>

    <body
        class="relative flex min-h-screen flex-col overflow-x-hidden bg-noche bg-[url('../assets/img/bg.webp')] bg-cover bg-[position:50%_30%] px-4 font-serif text-luna">

        <!-- Cabecera: espacio reservado para el logo -->
        <header class="relative z-10 w-full shrink-0 pt-3 sm:pt-4">
            <a href="../index.html" class="inline-block">
                <img src="../assets/img/logo.png" alt="Afterdark" class="h-14 w-auto sm:h-16">
            </a>
        </header>

        <!-- Contenido principal -->
        <main class="relative z-10 flex w-full flex-1 items-center justify-center py-3">

            <!-- Tarjeta de inicio de sesión -->
            <section
                class="my-auto w-full max-w-[390px] rounded-3xl bg-noche/75 px-7 py-7 backdrop-blur-sm sm:px-9 sm:py-8">

                <h1 class="mb-7 text-center text-2xl sm:text-3xl text-luna">
                    Bienvenido de nuevo
                </h1>

                <form action="#" method="post" class="flex flex-col">

                    <!-- Correo electrónico -->
                    <label for="email" class="mb-1 text-sm text-luna">
                        Correo electrónico
                    </label>

                    <div class="mb-4 flex items-center gap-3 rounded-xl bg-violeta px-3 py-2.5">
                        <img src="../assets/icons/mail.svg" alt="" class="h-6 w-6 shrink-0 ">

                        <input id="email" name="email" type="email" placeholder="tucorreo@ejemplo.com"
                            autocomplete="email" required
                            class="w-full min-w-0 bg-transparent font-sans text-sm text-luna outline-none placeholder:text-luna/60">
                    </div>

                    <!-- Contraseña -->
                    <label for="password" class="mb-1 text-sm text-luna">
                        Contraseña
                    </label>

                    <div class="flex items-center gap-3 rounded-xl bg-violeta px-3 py-2.5">
                        <img src="../assets/icons/lock.svg" alt="" class="h-6 w-6 shrink-0 ">

                        <input id="password" name="password" type="password" placeholder="Tu contraseña"
                            autocomplete="current-password" required
                            class="w-full min-w-0 bg-transparent font-sans text-sm text-luna outline-none placeholder:text-luna/60">

                        <button type="button" data-toggle-password="password" aria-label="Mostrar contraseña"
                            class="shrink-0">
                            <img src="../assets/icons/eye.svg" alt="" class="h-6 w-6 ">
                        </button>
                    </div>

                    <!-- Recuperación de contraseña -->
                    <a href="#" class="mb-4 mt-3 self-end text-sm hover:underline text-luna">
                        ¿Has olvidado tu contraseña?
                    </a>

                    <!-- Inicio de sesión -->
                    <button type="submit"
                        class="min-h-11 rounded-full bg-lila px-4 py-2 text-lg text-noche hover:bg-luna">
                        Iniciar sesión
                    </button>

                    <!-- Acceso con Google -->
                    <button type="button"
                        class="mt-3 flex min-h-11 items-center justify-center gap-3 rounded-full border border-luna/70 px-4 py-2 hover:bg-luna/10">
                        <img src="../assets/icons/google-icon.svg" alt="" class="h-6 w-6 shrink-0">
                        <span>Continuar con Google</span>
                    </button>

                </form>

                <!-- Enlace al registro -->
                <p class="mt-6 text-center text-sm text-luna">
                    ¿Todavía no tienes cuenta?
                    <a href="registro.html" class="font-semibold hover:underline">
                        Regístrate
                    </a>
                </p>

            </section>
        </main>

    </body>

</html>
