<!doctype html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Iniciar sesión | Afterdark</title>

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>

        <link rel="icon" type="image/png" href="../assets/img/favicon.png">

        <!-- Tipografías -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;500;600&display=swap" rel="stylesheet">

        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet">

        <!-- Configuración Tailwind -->
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            noche: '#0F061E',
                            violeta: '#7151A9',
                            lila: '#DAC7FF',
                            luna: '#F4EFFA'
                        },
                        fontFamily: {
                            serif: ['Literata', 'Georgia', 'serif'],
                            sans: ['DM Sans', 'sans-serif']
                        }
                    }
                }
            }
        </script>

        <script src="../js/main.js" defer></script>
    </head>

    <body
        class="relative flex min-h-screen flex-col bg-noche bg-[url('../assets/img/bg.webp')] bg-cover bg-fixed bg-center px-4 font-serif text-luna">



        <!-- CABECERA -->
        <header class="relative z-10 w-full shrink-0 pt-3 sm:pt-4">

            <a href="../index.html" class="inline-block">
                <img src="../assets/img/logo.png" alt="Afterdark" class="h-10 w-auto sm:h-12">
            </a>

        </header>


        <!-- CONTENIDO PRINCIPAL -->
        <main class="relative z-10 flex min-h-0 w-full flex-1 items-center justify-center py-3">

            <!-- TARJETA DE INICIO DE SESIÓN -->
            <section
                class="my-auto w-full max-w-[340px] rounded-3xl border border-lila/15 bg-noche/65 px-6 py-5 shadow-2xl shadow-black/20 backdrop-blur-md sm:px-7 sm:py-6">

                <h1 class="mb-5 text-center text-xl text-luna sm:text-2xl">
                    Bienvenido de nuevo
                </h1>


                <form action="#" method="post" class="flex flex-col">

                    <!-- CORREO ELECTRÓNICO -->
                    <label for="email" class="mb-1 text-xs text-luna sm:text-sm">
                        Correo electrónico
                    </label>

                    <div
                        class="mb-3 flex h-8 items-center gap-2.5 rounded-xl bg-violeta px-3 transition-all duration-300 focus-within:ring-1 focus-within:ring-lila/60">

                        <img src="../assets/icons/mail.svg" alt="" class="h-4 w-4 shrink-0 opacity-90">

                        <input id="email" name="email" type="email" placeholder="tucorreo@ejemplo.com"
                            autocomplete="email" required
                            class="w-full min-w-0 bg-transparent font-sans text-xs text-luna outline-none placeholder:text-luna/60 sm:text-sm">

                    </div>


                    <!-- CONTRASEÑA -->
                    <label for="password" class="mb-1 text-xs text-luna sm:text-sm">
                        Contraseña
                    </label>

                    <div
                        class="flex h-8 items-center gap-2.5 rounded-xl bg-violeta px-3 transition-all duration-300 focus-within:ring-1 focus-within:ring-lila/60">

                        <img src="../assets/icons/lock.svg" alt="" class="h-4 w-4 shrink-0 opacity-90">

                        <input id="password" name="password" type="password" placeholder="Tu contraseña"
                            autocomplete="current-password" required
                            class="w-full min-w-0 bg-transparent font-sans text-xs text-luna outline-none placeholder:text-luna/60 sm:text-sm">

                        <button type="button" data-toggle-password="password" aria-label="Mostrar contraseña"
                            class="shrink-0 transition-opacity hover:opacity-70">

                            <img src="../assets/icons/eye.svg" alt="" class="h-4 w-4">

                        </button>

                    </div>


                    <!-- RECUPERACIÓN DE CONTRASEÑA -->
                    <a href="#"
                        class="mb-3 mt-2 self-end font-sans text-[11px] text-luna/90 transition-colors hover:text-lila hover:underline sm:text-xs">
                        ¿Has olvidado tu contraseña?
                    </a>


                    <!-- INICIO DE SESIÓN -->
                    <button type="submit"
                        class="h-9 rounded-full bg-lila px-4 text-sm text-noche transition-all duration-300 hover:bg-luna">

                        Iniciar sesión

                    </button>


                    <!-- ACCESO CON GOOGLE -->
                    <button type="button"
                        class="mt-2.5 flex h-9 items-center justify-center gap-2.5 rounded-full border border-luna/60 px-4 text-xs text-luna transition-all duration-300 hover:border-lila hover:bg-lila/10 sm:text-sm">

                        <img src="../assets/icons/google-icon.svg" alt="" class="h-4 w-4 shrink-0">

                        <span>Continuar con Google</span>

                    </button>

                </form>


                <!-- ENLACE AL REGISTRO -->
                <p class="mt-4 text-center font-sans text-[11px] leading-relaxed text-luna/90 sm:text-xs">

                    ¿Todavía no tienes cuenta?

                    <a href="registro.html"
                        class="font-semibold text-lila transition-colors hover:text-luna hover:underline">
                        Regístrate
                    </a>

                </p>

            </section>

        </main>

    </body>

</html>
